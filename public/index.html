  <style>/* loading screen: shown until the app has drawn its first page */
    #splash { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: #0F0F12; color: #EEEAE2; transition: opacity .5s ease, visibility .5s; }
    #splash.out { opacity: 0; visibility: hidden; }
    #splash .sp-inner { display: grid; justify-items: center; gap: 26px; }
    #splash .sp-deck { position: relative; width: 168px; height: 168px; }
    #splash .sp-disc { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, #0F0F12 0 3%, var(--g1, #D9668C) 3.5% 30%, rgba(0,0,0,.4) 30.5% 31.5%, transparent 32%), repeating-radial-gradient(circle, #121211 0 1.5px, #1d1d1b 1.5px 3px); box-shadow: 0 10px 30px rgba(0,0,0,.28); animation: sp-spin 1.6s linear infinite, sp-in .7s cubic-bezier(.2,.8,.2,1) both; }
    #splash .sp-disc::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 30deg, transparent 0 8%, rgba(255,255,255,.16) 12%, transparent 18% 58%, rgba(255,255,255,.1) 62%, transparent 68%); animation: sp-spin 1.6s linear infinite reverse; }
    #splash .sp-arm { position: absolute; right: -26px; top: -6px; width: 14px; height: 14px; border-radius: 50%; background: currentColor; transform-origin: 50% 50%; transform: rotate(-40deg); animation: sp-arm 1s .4s cubic-bezier(.2,.8,.2,1) forwards; }
    #splash .sp-arm::after { content: ""; position: absolute; left: 5.5px; top: 7px; width: 3px; height: 92px; background: currentColor; border-radius: 2px; transform-origin: 50% 0; transform: rotate(22deg); }
    #splash .sp-word { font: 600 22px/1 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .3em; display: flex; padding-left: .3em; }
    #splash .sp-word span { display: inline-block; opacity: 0; transform: translateY(14px); animation: sp-letter .55s cubic-bezier(.2,.8,.2,1) forwards; }
    #splash .sp-word span.m { color: var(--g1, #D9668C); }
    #splash .sp-eq { display: flex; gap: 4px; height: 18px; align-items: flex-end; }
    #splash .sp-eq i { width: 4px; height: 4px; background: var(--g1, #D9668C); border-radius: 1px; animation: sp-eq .9s ease-in-out infinite; }
    #splash .sp-eq i:nth-child(2) { animation-delay: .15s; } #splash .sp-eq i:nth-child(3) { animation-delay: .3s; } #splash .sp-eq i:nth-child(4) { animation-delay: .45s; } #splash .sp-eq i:nth-child(5) { animation-delay: .6s; }
    #splash .sp-tag { font: 700 13px/1 "Zen Kaku Gothic New", sans-serif; letter-spacing: .18em; color: #B9B4AA; opacity: 0; animation: sp-letter .6s .95s cubic-bezier(.2,.8,.2,1) forwards; margin-top: -10px; }
    @keyframes sp-spin { to { transform: rotate(360deg); } }
    @keyframes sp-in { from { opacity: 0; transform: scale(.85) rotate(-60deg); } }
    @keyframes sp-arm { to { transform: rotate(0deg); } }
    @keyframes sp-letter { to { opacity: 1; transform: none; } }
    @keyframes sp-eq { 0%, 100% { height: 4px; } 50% { height: 18px; } }
  </style>
